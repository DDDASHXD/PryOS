name: Bug report
description: Report a reproducible PryOS or build problem
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include expected behavior and steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: PryOS commit/version, builder OS and CPU architecture, VM or physical machine, BIOS/UEFI, Secure Boot, Ventoy mode/version.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Relevant errors or screenshots only. Do not include credentials, recovery keys, personal data or disk images.
